
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>Yanapiri Wawa - Cuidado Infantil</title>
      <meta name="description" content="Aplicación de seguimiento domiciliario infantil y priorización de atenciones en salud." />
      
      <!-- PWA Meta Tags -->
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#12B1E7" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="Yanapiri Wawa" />
      
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

      <!-- GitHub Pages SPA Redirect Handler -->
      <script>
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location));
      </script>
    </head>


    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
